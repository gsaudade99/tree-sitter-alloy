id = "alloy"
name = "Alloy Language Support"
description = "Grafana Alloy configuration language support with Tree-sitter"
version = "0.1.0"
schema_version = 1
authors = ["Matthew Conway <your.email@example.com>"]
repository = "https://github.com/mattsre/tree-sitter-alloy"

[language_servers.alloy-lsp]
name = "alloy-lsp"
language = "alloy"

[grammars.alloy]
repository = "https://github.com/mattsre/tree-sitter-alloy"
commit = "main"

[languages.alloy]
name = "Alloy"
grammar = "alloy"
scope = "source.alloy"
injection_regex = "alloy"
file_types = ["alloy"]
comment_tokens = ["//"]
block_comment_tokens = [{ start = "/*", end = "*/" }]
language_servers = ["alloy-lsp"]
auto_indent_using_last_non_empty_line = true

[languages.alloy.brackets]
pairs = [
    { start = "{", end = "}" },
    { start = "[", end = "]" },
    { start = "(", end = ")" },
    { start = "\"", end = "\"" },
]

[languages.alloy.autoclose]
pairs = [
    { start = "{", end = "}" },
    { start = "[", end = "]" },
    { start = "(", end = ")" },
    { start = "\"", end = "\"" },
]